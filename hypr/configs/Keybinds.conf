
# /* ---- 💫 https://github.com/JaKooLit 💫 ---- */  #
# This is where you put your own keybinds. Be Mindful to check as well ~/.config/hypr/configs/Keybinds.conf to avoid conflict
# if you think I should replace the Pre-defined Keybinds in ~/.config/hypr/configs/Keybinds.conf , submit an issue or let me know in DC and present me a valid reason as to why, such as conflicting with global shortcuts, etc etc

# See https://wiki.hyprland.org/Configuring/Keywords/ for more settings and variables
# See also Laptops.conf for laptops keybinds 

# /* ---- ✴️ Variables ✴️ ---- */  #
$scriptsDir = $HOME/.config/hypr/scripts
$UserConfigs = $HOME/.config/hypr/UserConfigs
$UserScripts = $HOME/.config/hypr/UserScripts
$term = "alacritty"
$files = "thunar"
$edit = "nvim"
# common shortcuts
bindr = super,a, exec, pkill rofi || rofi -show drun -modi drun,filebrowser,run,window # Super Key to Launch rofi menu
# bind = super, q, exec, $scriptsDir/RofiSearch.sh # Google search using rofi
# bind = super, q, exec, $scriptsDir/Kool_Quick_Settings.sh # Settings Menu K# will switch to a submap called resize
bind = super alt, q, exec, cliphist list | rofi -dmenu | cliphist decode | wl-copy
bind = super alt, w, exec, $scriptsDir/KillActiveProcess.sh # Kill active process
bind = super, w, killactive, # close active (not kill)
# bind = super alt, q, exec, $scriptsDir/LockScreen.sh # screen lock
# bind = super , q, exec, $scriptsDir/Wlogout.sh # power menu
bind = super , f, exec, swaync-client -t -sw # swayNC notification panel
bind = super, u, exec, [float; move 0.2% 0.5%; size 15.3% 99%] $term# Dropdown terminal
bind = super alt, u, exec, [float; move 84.55% 0.5%; size 15.3% 99%] $term# Dropdown terminal
bind = SUPER, o, exec, /home/dara/.config/hypr/scripts/mark5bt.sh
bind = super, i, exec, $term  #terminal
bind = super alt, f, exec, $files  #terminal
# bind = super, m, exec, #terminal
# bindel = super, f5, exec, hyprctl dispatch splitratio -0.10
# bindel =  super, f4, exec, hyprctl dispatch splitratio 0.10
bind = super, backspace, toggleswallow, 
bindel =  super ,f9, exec, hyprctl hyprsunset temperature +300 
bindel =  super ,f10, exec, hyprctl hyprsunset temperature -300 

bind = , mouse:275, exec, $scriptsDir/ScreenShot.sh --area # screenshot (area)
bind = , Print,exec, $scriptsDir/ScreenShot.sh --area # screenshot (area)
bind = , mouse:276, exec, wtype -M ctrl v -m ctrl
bind = super, f12, fullscreen, 2 # fake full screen
bindel = super alt, f9, exec, hyprctl hyprsunset gamma -10
bindel = super alt, f10, exec, hyprctl hyprsunset gamma +10
# group
# # # Waybar / Bar related
bind = super , b, exec, pkill -SIGUSR1 waybar # Toggle hide/show waybar 
bind = super super alt, b, exec, $scriptsDir/WaybarStyles.sh # Waybar Styles Menu
bind =  super alt, b, exec, $scriptsDir/WaybarLayout.sh # Waybar Layout Menuhttp://docs.google.com/document/d/1dyJwbfd9HJhVfs5EZJiU1fBl3Gp9RrgFhQnl7W36LWNA/edit?tab=t.0
bind = super alt, O, exec, hyprctl setprop active opaque toggle # disable opacity on active window
# #A
bindd = SUPER, D, Speech-to-text1, exec,  $scriptsDir/stt-toggle.sh
bindd = , mouse:277, Speech-to-text2, exec,  $scriptsDir/stt-toggle.sh
# bind = super , f6, exec, $scriptsDir/vtc # search keybinds via rofi
# bind = super, , exec, $scriptsDir/.sh # search keybinds via rofi
# Dwindle Layout
# bind = super, p, pseudo, # dwindle
# Scroll through existing workspaces with mainMod + scroll
bind = super, r, workspace, e+1
bind = super alt, r, workspace, e-1
# Special workspace
bind = super alt, 0, movetoworkspace, special
bind = super, 0, togglespecialworkspace,

# bindm = super, mouse:272, movewindow # NOTE: mouse:272 = left click
# bindm = super, mouse:273, resizewindow # NOTE: mouse:273hypr/hypr/ = right click
bindm = super, mouse:272, movewindow # NOTE: mouse:272 = left click
bindm = super, mouse:273, resizewindow  # NOTE: mouse:273hypr/hypr/ = right click Move/resize windows with mainMod + LMB/RMB and dragging
# Cycle windows if floating bring to top
bind = super, g, cyclenext
bind = super, g, bringactivetotop  
#
bind = super alt, g, centerwindow,  
bind = super , p, togglefloating# only works on dwindle layout
bind = super alt, p, togglesplit, #Float Mode
# bind =  super, z, exec, $scriptsDir/Resize.sh # Toggle Master or Dwindle Layout
bind = super alt, d, exec, $scriptsDir/ChangeLayout.sh # Toggle Master or Dwindle Layout
# bind = super, r, exec, swapsplit
# bind = super alt, r, exec,  movetoroot
# bind = super , f12, exec, $scriptsDir/KeyBinds.sh # search keybinds via rofi
# bind = super, x, resizeactive, 340 0 
# bind = super , d, resizeactive, exact 1085 1128 
bind = super, tab, focusurgentorlast,

# bind = super alt, r, togglegroup # toggle group
# bind = super ,r, changegroupactive, b # change focus to another window
# Move focus with mainMod + arrow keys
# bind = , f6, movefocus, r
bind = super, t, movefocus, r
bind = super, n, movefocus, l
bind = super alt, t, movefocus, u
bind = super alt, n, movefocus, d
# # Move windows
# bind = super , d, movewindow, r
# bind = super , w, movewindow, l
# bind = super , v, movewindow, u
# bind = super , x, movewindow, d
# bind =  super, y, exec, hyprctl dispatch workspaceopt allfloat #All Float Mode
# bind = super, a, movewindowpixel, exact 0 0
# Swap windows
bind = super, c, movewindow, r
bind = super, l, movewindow, l
bind = super alt, c, movewindow, u
bind = super alt, l, movewindow, d 
# # Resize windows
# binde = super alt, t, resizeactive,200 0
bind = super , s, resizeactive, -200 0
# binde = super alt, s, resizeactive,-200 0
binde = super alt, s, resizeactive,200 0
binde = super, v, resizeactive,0 50
binde = super alt, v, resizeactive,0 -50
binde = super alt, z, movetoworkspace, -1 # brackets [
binde = super , z, movetoworkspace, +1 # brackets ]
# Workspaces related
bind =  super, code:10, workspace, 1 # NOTE: code:10 = key 1
bind =  super, code:11, workspace, 2 # NOTE: code:11 = key 2
bind =  super, code:12, workspace, 3 # NOTE: code:12 = key 3
bind =  super, code:13, workspace, 4 # NOTE: code:13 = key 4
bind =  super, code:14, workspace, 5 # NOTE: code:14 = key 5
bind =  super, code:15, workspace, 6 # NOTE: code:14 = key 5
# Move active window and follow to workspace mainMod + alt [0-9]
# bind = super alt, code:10, movetoworkspace, 1 # NOTE: code:10 = key 1
# bind = super alt, code:11, movetoworkspace, 2 # NOTE: code:11 = key 2
# bind = super alt, code:12, movetoworkspace, 3 # NOTE: code:12 = key 3
# bind = super alt, code:13, movetoworkspace, 4 # NOTE: code:13 = key 4
# bind = super alt, code:14, movetoworkspace, 5 # NOTE: code:14 = key 5

# # # Move active window to a workspace silently mainMod +  [0-9]
bind = super alt, 1, movetoworkspacesilent, 1 # NOTE: code:10 = key 1
bind = super alt, 2, movetoworkspacesilent, 2 # NOTE: code:10 = key 1
bind = super alt, 3, movetoworkspacesilent, 3 # NOTE: code:10 = key 1
bind = super alt, 4, movetoworkspacesilent, 4 # NOTE: code:10 = key 1
bind = super alt, 5, movetoworkspacesilent, 5 # NOTE: code:10 = key 1
bind = super alt, 6, movetoworkspacesilent, 6 # NOTE: code:10 = key 1
